[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lifemate-baseline"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.2.0"]
# .venv: local vLLM server and agent runs (the Docker image uses vllm/vllm-openai:v0.32.0 + docker/requirements.txt)
infer = ["vllm==0.32.0", "sherpa-onnx==2.0.1", "soundfile==0.14.0"]
# .venv-train: agent LoRA SFT (scripts/train/train_agent_sft.py); the versions the released adapters were trained with
sft = ["unsloth==2026.10.11", "unsloth_zoo==2026.10.11", "trl==1.15.0", "peft==0.21.2", "transformers==5.17.0", "torch==2.14.1",
       "accelerate==1.15.0", "datasets==4.8.5", "bitsandbytes==0.50.2"]
# .venv-asr (Gipformer fine-tuning with k2/kaldifeat/icefall) is built by scripts/setup/setup_asr_env.sh

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
