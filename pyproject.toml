[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lifemate-baseline"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.2.0"]
# .venv: local vLLM server and agent runs (the Docker image uses vllm/vllm-openai:v0.32.0 + docker/requirements.txt)
infer = ["vllm==0.32.0", "sherpa-onnx==2.0.1", "soundfile==0.14.0"]
# .venv-train: agent QLoRA SFT (scripts/train/train_agent_sft.py); the unsloth version of the q35_e1 run was not recorded
sft = ["unsloth", "trl==1.1.0", "peft==0.18.0", "datasets==4.7.0", "bitsandbytes==0.48.2"]
# .venv-asr (Gipformer fine-tuning with k2/kaldifeat/icefall) is built by scripts/setup/setup_asr_env.sh

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
