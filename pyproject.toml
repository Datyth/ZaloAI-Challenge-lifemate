[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lifemate-baseline"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.2.0"]
models = ["qwen-asr[vllm]==0.0.6", "torch==2.9.1", "transformers==4.57.6", "huggingface-hub==0.36.0"]

[tool.setuptools.packages.find]
where = ["src"]
